<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Violets Rekenavontuur 🌈</title><style>
:root{font-family:ui-rounded,'Trebuchet MS',system-ui,sans-serif;color:#33304e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#fff0b8,#f9d9f1 55%,#d5f3ff);padding:22px}main{max-width:760px;margin:auto}.hero{text-align:center}h1{font-size:clamp(30px,6vw,48px);margin:10px 0 4px}.subtitle{font-size:18px;margin:0 0 16px}.panel{background:#ffffffed;border-radius:30px;padding:24px;box-shadow:0 12px 30px #6e5a9030}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pill{background:#f4e7ff;border-radius:30px;padding:10px 16px;font-weight:bold}button,select{font:inherit}select{padding:10px;border-radius:15px;border:2px solid #ddd0f8;background:white}.question{text-align:center;font-size:clamp(42px,10vw,74px);font-weight:900;margin:20px 0 10px}.dots{display:flex;justify-content:center;min-height:115px;align-items:center;gap:12px}.domino-row{display:flex;justify-content:center;align-items:center}.domino{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,42px);grid-auto-flow:column;gap:4px;padding:8px;background:transparent;border:0}.pip{border:0;border-radius:50%;width:31px;height:31px;align-self:center;justify-self:center;background:transparent;position:relative}.pip.filled{background:#548fea}.pip.second{background:#f29a4a}.pip.crossed.second{background:#f29a4a}.pip.added{background:#568ce4}.pip.crossed{background:#548fea}.pip.crossed:after{content:'╱';position:absolute;inset:-7px;color:#ed4968;font-size:43px;line-height:40px;font-weight:900;text-align:center}.pip.empty{background:transparent;border:0}.pip.empty:not(.interactive){visibility:hidden}.pip.empty.interactive{background:transparent;border:0}.pip.interactive{cursor:pointer;touch-action:manipulation}.pip.interactive:focus-visible{outline:3px solid #6c55d9;outline-offset:2px}.domino-hint{text-align:center;font-size:13px;color:#625c74;margin-top:6px}.domino-stack{display:flex;flex-direction:column;align-items:center}.visualstage{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}.symbol{font-size:30px;font-weight:bold}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.answer{border:0;border-radius:22px;background:#e8e3ff;padding:15px;font-size:35px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #c8baf8;touch-action:manipulation}.answer:hover{background:#d9d0ff}.answer:active{transform:translateY(3px);box-shadow:0 2px 0 #c8baf8}.answer:disabled{opacity:.65}.message{min-height:54px;text-align:center;font-size:22px;font-weight:bold;padding:15px 0 0}.next{display:block;margin:10px auto 0;background:#6c55d9;color:white;border:0;padding:15px 25px;border-radius:20px;font-size:20px;font-weight:bold;cursor:pointer} .helper{margin:18px 0 4px;background:#f8f4ff;border-radius:20px;padding:14px}.helperhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.helper label{font-weight:bold}.helper select{max-width:100%}.instruction{text-align:center;font-weight:bold;margin:12px 0 4px}.helperactions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.smallbtn{border:0;background:#e5dcff;border-radius:14px;padding:10px 16px;font-weight:bold;cursor:pointer}.hidden{display:none}.progress{height:13px;background:#f0eafa;border-radius:20px;overflow:hidden;margin-top:18px}.bar{height:100%;background:#78d7a5;width:0%;transition:width .3s}.footer{text-align:center;margin:15px;font-size:14px}.spark{font-size:34px}@media(max-width:420px){body{padding:10px}.panel{padding:16px}.dot{width:29px;height:29px}.dot.cross:after{line-height:27px}}
.toolchoice{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:12px 0}.toolbtn{border:2px solid #ded5f7;border-radius:14px;background:white;padding:12px 14px;font-weight:800;cursor:pointer;touch-action:manipulation}.toolbtn.active{background:#dcd3ff;border-color:#745ad8}#placeTool.active{background:#d9eaff;border-color:#548fea}#orangeTool.active{background:#fff0dd;border-color:#f29a4a}.domino.build{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:4px}.domino.build .pip{width:34px;height:34px}.domino.build .pip.empty{visibility:visible;background:transparent;border:0}.domino.build .pip.empty:focus-visible{outline:3px solid #745ad8}.domino.build .pip.crossed:after{content:'╱';inset:-7px;font-size:43px;line-height:40px}.toolnote{text-align:center;font-size:14px;color:#625c74;margin:2px 0 8px}@media(max-width:420px){.domino.build{grid-template-columns:repeat(3,43px);grid-template-rows:repeat(2,43px)}}

.domino.build{grid-template-columns:repeat(5,44px);grid-template-rows:repeat(2,44px);gap:5px;grid-auto-flow:column}.domino.build .pip{width:35px;height:35px}.domino.build .pip.empty{visibility:visible;background:#ffffff;border:2px dashed #b7a9e5}.domino.build .pip.empty:hover{background:#e9e2ff;border-color:#755bd8}.domino.build .pip.added{background:#548fea;border:2px solid transparent}.domino.build .pip.added.second{background:#f29a4a}.domino.build .pip.crossed{background:#548fea}.domino.build .pip.crossed:after{content:'╱';color:#ed4968;font-size:43px;inset:-7px;line-height:40px}.celebration{position:fixed;inset:0;z-index:20;background:#30225b99;display:flex;align-items:center;justify-content:center;padding:18px}.celebration.hidden{display:none}.partycard{background:white;border-radius:30px;padding:25px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 70px #32205a70}.partycard h2{font-size:30px;margin:8px 0}.partycard img{width:100%;max-width:320px;height:210px;object-fit:contain;image-rendering:auto}.partycard button{background:#6c55d9;color:white;border:0;border-radius:18px;padding:15px 22px;font-weight:900;font-size:19px;cursor:pointer}.partycard p{font-weight:bold}.chosen-animation{height:225px;display:flex;align-items:center;justify-content:center}.chosen-animation iframe{height:220px;width:100%;max-width:340px;border:0;border-radius:14px}.toolnote{margin:8px 0}@media(max-width:420px){.domino.build{grid-template-columns:repeat(5,35px);grid-template-rows:repeat(2,40px);gap:3px}.domino.build .pip{width:29px;height:29px}}
</style></head><body><main><header class="hero"><div class="spark">🌈 🦄 ⭐</div><h1>Violets Rekenavontuur</h1><p class="subtitle">Rekenen is een feestje! 🎉</p></header><section class="panel"><div class="toolbar"><label>Oefenen: <select id="mode"><option value="mix">Plus en min</option><option value="plus">Optellen ➕</option><option value="minus">Aftrekken ➖</option></select></label><div class="pill" id="score">⭐ 0 sterren</div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="helper"><div class="helperhead"><label for="visual">🧮 Visuele hulp</label><select id="visual"><option value="show">Bolletjes tonen</option><option value="build">Zelf bolletjes aanklikken</option><option value="off">Zonder bolletjes</option></select></div><div id="buildArea" class="hidden"><p class="instruction" id="instruction"></p><div class="toolchoice" role="group" aria-label="Kies wat je met de bolletjes doet"><button type="button" id="placeTool" class="toolbtn active" aria-pressed="true">🔵 Blauw plaatsen</button><button type="button" id="orangeTool" class="toolbtn" aria-pressed="false">🟠 Oranje plaatsen</button><button type="button" id="crossTool" class="toolbtn" aria-pressed="false">╱ Doorstrepen</button></div><p class="toolnote">Tik op een gestippelde cirkel om een bolletje te plaatsen. Je kunt er maximaal 10 gebruiken.</p><div class="visualstage" id="slots"></div><div class="helperactions"><button class="smallbtn" id="resetDots">↻ Opnieuw proberen</button></div></div></div><div class="question" id="question" aria-live="polite"></div><div class="dots" id="dots" aria-label="Bolletjes om te tellen"></div><div class="answers" id="answers"></div><div class="message" id="message" aria-live="polite">Kies het juiste antwoord! 💜</div><button class="next hidden" id="next">Volgende som ➜</button></section><p class="footer">💜 Goed oefenen, Violet! Je kunt het! 💜</p></main><div id="celebration" class="celebration hidden" role="dialog" aria-modal="true" aria-labelledby="partyTitle"><div class="partycard"><h2 id="partyTitle">🎉 Mini-feestje! 🎉</h2><div id="chosenAnimation" class="chosen-animation"><iframe id="partyFrame" title="Grappige feestanimatie" loading="lazy" referrerpolicy="no-referrer" allowfullscreen></iframe><img id="partyGif" alt="Vrolijke bewegende beloning" style="display:none"></div><p id="partyText">10 oefeningen klaar! Fantastisch gedaan!</p><button id="partyContinue">Joepie! Verder spelen ➜</button></div></div><script>
const $=id=>document.getElementById(id);
function readStars(){try{return Number(window.localStorage.getItem('violetStars')||0)||0}catch(e){return 0}}
function saveStars(n){try{window.localStorage.setItem('violetStars',String(n))}catch(e){/* Preview browsers can block storage. */}}
let stars=readStars(),done=0,correct=0,a=0,b=0,op='+',locked=false,previous='',tool='place';
let placed=new Map(),crossed=new Set(),placeColor='blue';
const praise=['Super gedaan! 🌟','Wauw, wat knap! 🦄','Helemaal juist! 🎉','Jij bent een rekenster! 💜'];
function rand(n){return Math.floor(Math.random()*(n+1))}
// Positions are filled top, bottom, next column top, bottom, then fifth top.
function makeDots(total,build=false){
 const tile=document.createElement('div');tile.className='domino'+(build?' build':'');
 for(let i=0;i<(build?10:6);i++){
  const visible=build?placed.has(i):i<total;
  const struck=build?crossed.has(i):(op==='−'&&i>=a-b&&i<a);
  const pip=document.createElement(build?'button':'span');if(build)pip.type='button';
  pip.className='pip '+(visible?(build?'added':'filled'):'empty')+(build?' interactive':'')+(visible?(build?(placed.get(i)==='orange'?' second':''):(op==='+'?i>=a: i>=a-b)?' second':''):'')+(struck?' crossed':'');
  if(build){
   pip.setAttribute('aria-label',`Plaats ${i+1}: ${visible?'bolletje aanwezig':'leeg'}${struck?', doorgestreept':''}`);
   pip.onclick=()=>{
    if(locked)return;
    if(tool==='place'){
     if(placed.has(i)){placed.delete(i);crossed.delete(i)}
     else placed.set(i,placeColor);
    }else if(placed.has(i)){
     if(crossed.has(i))crossed.delete(i);else crossed.add(i);
    }
    renderVisual();
   };
  }
  tile.append(pip);
 }
 return tile;
}
function setTool(t){tool=t;for(const [id,val] of [['placeTool','blue'],['orangeTool','orange'],['crossTool','cross']]){const active=(val===t);const el=$(id);el.classList.toggle('active',active);el.setAttribute('aria-pressed',String(active))}if(t!=='cross'){placeColor=t;tool='place'}}
function renderVisual(){
 const visual=$('visual').value,target=$('dots'),stage=$('slots');target.innerHTML='';stage.innerHTML='';
 $('buildArea').classList.toggle('hidden',visual!=='build');target.classList.toggle('hidden',visual!=='show');
 if(visual==='off')return;
 if(visual==='show'){target.append(makeDots(op==='+'?a+b:a));return}
 $('instruction').textContent='Begin met een leeg blad. Kies blauw of oranje om bolletjes te plaatsen, of streep bolletjes door.';
 stage.append(makeDots(0,true));
 const hint=document.createElement('p');hint.className='domino-hint';
 hint.textContent=`${placed.size} bolletje${placed.size===1?'':'s'} geplaatst · ${crossed.size} doorgestreept · ${placed.size-crossed.size} over`;
 stage.append(hint);
}
function newQuestion(){placed.clear();crossed.clear();setTool('blue');locked=false;$('next').classList.add('hidden');$('message').textContent='Kies het juiste antwoord! 💜';$('answers').innerHTML='';
 let mode=$('mode').value,tries=0;
 do{op=mode==='mix'?(Math.random()<.5?'+':'−'):mode==='plus'?'+':'−';if(op==='+'){a=rand(5);b=rand(5-a)}else{a=rand(5);b=rand(a)}tries++}while(`${a}${op}${b}`===previous&&tries<25);
 previous=`${a}${op}${b}`;correct=op==='+'?a+b:a-b;$('question').textContent=`${a} ${op} ${b} = ?`;renderVisual();
 for(let n=0;n<=5;n++){const btn=document.createElement('button');btn.className='answer';btn.textContent=n;btn.setAttribute('aria-label','Antwoord '+n);btn.onclick=()=>answer(n,btn);$('answers').append(btn)}
}
function answer(n,btn){if(locked)return;if(n===correct){locked=true;stars++;done++;saveStars(stars);$('score').textContent=`⭐ ${stars} sterren`;$('bar').style.width=(done%10)*10+'%';$('message').textContent=praise[rand(praise.length-1)];btn.style.background='#a7ebbe';$('next').classList.remove('hidden');if(done%10===0){$('message').textContent='🏆 10 sommen! Wat een kampioen! 🏆';$('bar').style.width='100%';showParty()}}else{btn.style.background='#ffd1d8';$('message').textContent='Bijna! Kijk nog eens naar de bolletjes. 💪';setTimeout(()=>{if(!locked)btn.style.background=''},650)}}
$('next').onclick=newQuestion;
$('visual').onchange=()=>{placed.clear();crossed.clear();setTool('blue');renderVisual()};
$('placeTool').onclick=()=>setTool('blue');$('orangeTool').onclick=()=>setTool('orange');$('crossTool').onclick=()=>setTool('cross');
$('resetDots').onclick=()=>{placed.clear();crossed.clear();setTool('blue');renderVisual()};
$('mode').onchange=()=>{done=0;$('bar').style.width='0%';newQuestion()};
